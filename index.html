<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flashcards Editor</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<style>
  body { padding: 20px; }
  .card-box {
    border: 1px solid #ddd;
    padding: 15px;
    border-radius: 8px;
    background: #f8f9fa;
    margin-bottom: 15px;
  }
</style>
</head>
<body>

<div class="container">

  <h1 class="mb-4">Flashcards Editor</h1>

  <!-- Load JSON -->
  <div class="mb-4">
    <label class="form-label"><strong>Load JSON File:</strong></label>
    <input type="file" id="fileInput" accept=".json" class="form-control">
  </div>

  <!-- Add Card -->
  <div class="mb-4 p-3 border rounded bg-light">
    <h4>Add New Card</h4>

    <div class="mb-2">
      <label class="form-label">Term</label>
      <input type="text" id="newTerm" class="form-control">
    </div>

    <div class="mb-2">
      <label class="form-label">Definition</label>
      <textarea id="newDefinition" class="form-control" rows="3"></textarea>
    </div>

    <button id="addCardBtn" class="btn btn-primary">Add Card</button>
  </div>

  <!-- Cards List -->
  <h3>Cards</h3>
  <div id="cards"></div>

  <!-- Save JSON -->
  <button id="saveBtn" class="btn btn-success mt-3">Save JSON to File</button>

</div>

<script>
let data = { cards: [] };

function getNextId() {
  if (data.cards.length === 0) return 1;
  return Math.max(...data.cards.map(c => c.id || 0)) + 1;
}

function renderCards() {
  $("#cards").empty();

  data.cards.forEach((card, index) => {
    const cardBox = $(`
      <div class="card-box">
        <div class="mb-2">
          <label class="form-label">ID</label>
          <input type="number" class="form-control id-input" value="${card.id}">
        </div>
        <div class="mb-2">
          <label class="form-label">Term</label>
          <input type="text" class="form-control term-input" value="${card.term}">
        </div>
        <div class="mb-2">
          <label class="form-label">Definition</label>
          <textarea class="form-control def-input" rows="3">${card.definition}</textarea>
        </div>
        <button class="btn btn-danger btn-sm delete-btn">Delete</button>
      </div>
    `);

    // Update ID
    cardBox.find(".id-input").on("input", function () {
      data.cards[index].id = Number($(this).val());
    });

    // Update term
    cardBox.find(".term-input").on("input", function () {
      data.cards[index].term = $(this).val();
    });

    // Update definition
    cardBox.find(".def-input").on("input", function () {
      data.cards[index].definition = $(this).val();
    });

    // Delete card
    cardBox.find(".delete-btn").on("click", function () {
      data.cards.splice(index, 1);
      renderCards();
    });

    $("#cards").append(cardBox);
  });
}

// Add new card
$("#addCardBtn").on("click", function () {
  const term = $("#newTerm").val().trim();
  const definition = $("#newDefinition").val().trim();

  if (!term || !definition) {
    alert("Please enter both term and definition.");
    return;
  }

  const newId = getNextId();

  data.cards.push({ id: newId, term, definition });

  $("#newTerm").val("");
  $("#newDefinition").val("");

  renderCards();
});

// Load JSON file
$("#fileInput").on("change", function (event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function (e) {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!Array.isArray(parsed.cards)) {
        alert("Invalid JSON: expected { cards: [...] }");
        return;
      }
      data = parsed;
      renderCards();
    } catch (err) {
      alert("Error parsing JSON file.");
    }
  };
  reader.readAsText(file);
});

// Save JSON file
$("#saveBtn").on("click", function () {
  const jsonStr = JSON.stringify(data, null, 2);
  const blob = new Blob([jsonStr], { type: "application/json" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "cards.json";
  a.click();

  URL.revokeObjectURL(url);
});
</script>

</body>
</html>
